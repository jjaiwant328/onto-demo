command: ['npm', 'run', 'start']
env:
  # Inject the SQL warehouse id (from the attached `sql-warehouse` resource) for
  # the AppKit analytics plugin. The Databricks Apps builder runs `npm install`
  # + `npm run build` (which needs devDependencies like tsc/vite), then runs this
  # command. The `start` script sets NODE_ENV=production for the running server.
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # Foundation Model endpoint name for the optional catalog-polish LLM pass
  # (serving plugin alias "llm"). From the attached `serving-endpoint` resource.
  - name: DATABRICKS_SERVING_ENDPOINT_NAME
    valueFrom: serving-endpoint
  # Lakebase (Autoscaling Postgres) for the app's OPERATIONAL state tables
  # (saved_schemas / action_log / product_links). Analytical data stays on the
  # SQL warehouse. The app connects as the attached SP via @databricks/lakebase
  # (OAuth token auto-refresh). Instance `jai-onto-demo`, branch production.
  - name: PGHOST
    value: 'ep-long-mountain-d27it82n.database.us-east-1.cloud.databricks.com'
  - name: PGDATABASE
    value: 'databricks_postgres'
  - name: PGUSER
    value: 'ccd7b429-2606-409d-bc81-90b912e5e84e'
  - name: LAKEBASE_ENDPOINT
    value: 'projects/jai-onto-demo/branches/production/endpoints/primary'
  - name: PGSSLMODE
    value: 'require'
  # Companion apps the server integrates with: ontos (governance system of
  # record for contracts/data products) and jai_ontobricks (ontology graph,
  # GraphQL neighbor expansion). Empty defaults here — the operator sets the
  # real values as app secrets. While unset, the /api/contract*, /api/graph/
  # neighbors routes degrade to their offline shapes.
  - name: ONTOS_APP_URL
    value: ''
  - name: ONTOS_MCP_TOKEN
    value: ''
  - name: ONTOBRICKS_APP_URL
    value: ''
  - name: ONTOBRICKS_TOKEN
    value: ''
  # ontobricks ontology domain (default domain for /api/graph/neighbors)
  - name: ONTOBRICKS_DOMAIN
    value: ''
  # Machine SP OAuth credentials that mint the Apps-gate bearer token
  # (server/spGateToken.ts) for calls to the companion apps. Empty defaults
  # here — the operator sets the real values as app secrets.
  - name: RT_INTEGRATION_SP_CLIENT_ID
    value: ''
  - name: RT_INTEGRATION_SP_SECRET
    value: ''
