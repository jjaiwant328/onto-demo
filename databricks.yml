bundle:
  name: rt-onto-demo

# The bundled demo-schema JSONs are gitignored (they carry demo data kept out of
# the git remote), but the client build imports them, so force them into the
# deploy sync despite .gitignore.
sync:
  include:
    - client/src/data/schema.qsr.json
    - client/src/data/schema.qsr_sc.json

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
    default: bf7ffcda00a8c351
  app_name:
    description: Deployed app name (varies by target)
    default: rt-onto-demo

resources:
  apps:
    app:
      name: ${var.app_name}
      description: "A Databricks App powered by AppKit"
      source_code_path: ./
      # user_api_scopes:
      #   - sql

      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: serving-endpoint
          serving_endpoint:
            name: databricks-claude-sonnet-4-5
            permission: CAN_QUERY

# =============================================================================
# TARGETS: Multi-environment lifecycle (dev -> staging -> prod)
# =============================================================================
targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://fe-vm-jai-classic-ws.cloud.databricks.com
    variables:
      app_name: rt-onto-demo-dev-${workspace.current_user.short_name}

  staging:
    workspace:
      host: https://fe-vm-jai-classic-ws.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: rt-onto-demo-staging
    run_as:
      service_principal_name: 'bd3dd6e7-e022-432e-975c-e8965d56ee2f'
    permissions:
      - service_principal_name: 'bd3dd6e7-e022-432e-975c-e8965d56ee2f'
        level: CAN_MANAGE
      - user_name: jaiwant.jonathan@databricks.com
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      host: https://fe-vm-jai-classic-ws.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: rt-onto-demo
    run_as:
      service_principal_name: '675ab5ff-bb2c-4917-9d0e-e6bc807f336e'
    permissions:
      - service_principal_name: '675ab5ff-bb2c-4917-9d0e-e6bc807f336e'
        level: CAN_MANAGE
      - user_name: jaiwant.jonathan@databricks.com
        level: CAN_MANAGE
