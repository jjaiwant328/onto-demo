# Ontos data product registration
apiVersion: ontos/v1
kind: DataProduct
metadata:
  product_name: jai_store_traffic_labor_efficiency
  display_name: Store Traffic & Labor Efficiency
  domain: retail_store_operations
  owner: jaiwant.jonathan@databricks.com
  maturity: incubating
  tags: [retail, labor, traffic, efficiency, store-ops]
spec:
  business_outcome: >-
    Identify stores over- or under-staffed relative to customer traffic, and rank
    the largest efficiency opportunities by labor cost per customer.
  serving:
    primary_view: jai_ontos.demo_schema.jai_store_day_traffic_labor
    summary_view: jai_ontos.demo_schema.jai_store_efficiency_summary
    opportunities_view: jai_ontos.demo_schema.jai_store_efficiency_opportunities
    warehouse_id: "310314146ebd3230"
  semantics:
    ontology_file: ontology/retail_traffic_labor.ttl
    semantic_measures_file: ontology/semantic_measures.yaml
    semantic_model: ontos/semantics/jai_store_traffic_labor_semantic_model.yaml
    classes: [Store, CalendarDay, StoreTrafficDay, StoreLaborDay, StoreDayEfficiency]
  contract:
    file: ontos/contracts/jai_store_traffic_labor_efficiency_contract.yaml
    status: defined
  kpis:
    - name: labor_cost_per_customer
      direction: lower_is_better
    - name: labor_hours_per_customer
      direction: lower_is_better
    - name: dual_customer_conversion_rate_pct
      direction: higher_is_better
  lineage:
    sources:
      - table: fc_entdata_gold.cdm_dim.dim_store
        concept: Store
      - table: fc_entdata_gold.cdm_dim.dim_calendar
        concept: CalendarDay
      - table: fc_entdata_gold.cdm_bi.smmry_labor
        concept: StoreLaborDay
      - table: fc_entdata_gold.cdm_pos.sale_transaction_header
        concept: StoreTrafficDay
      - table: fc_entdata_gold.cdm_bi.storebonuses
        concept: Store.regionName (enrichment)
    transforms:
      - sql/01_jai_store_day_traffic_labor.sql
      - sql/02_jai_store_efficiency_summary.sql
      - sql/03_jai_store_efficiency_opportunities.sql
  freshness:
    expectation: daily
    basis: business_date
  assumptions:
    - A2 source defaults to fc_entdata_gold; override for jai_ontos.rt_str_lbr
    - A3 region from storebonuses (monthly); division/area not available
    - A4 shop/fuel split via outside_sale_flag
    - A5 dual-customer metrics loyalty-biased (cust_id sparse)
status:
  ontology_status: draft
  contract_status: defined
  app_enabled: true
